<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Österreichische Geschichte – Zeitleiste</title>
    <meta name="description" content="Interaktive Zeitleiste zur österreichischen Geschichte: Herrscher, Bürgermeister, Baumeister und Ereignisse im Überblick." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='5.33' fill='%23C8102E'/%3E%3Crect y='5.33' width='16' height='5.33' fill='%23fff'/%3E%3Crect y='10.67' width='16' height='5.33' fill='%23C8102E'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header class="topbar">
      <h1>Österreichische Geschichte <span class="subtitle">Zeitleiste</span></h1>
      <div class="toolbar">
        <div class="group range">
          <label>von <input id="from" type="number" step="1" /></label>
          <label>bis <input id="to" type="number" step="1" /></label>
          <button id="zoom-out" title="Herauszoomen" aria-label="Herauszoomen">−</button>
          <button id="zoom-in" title="Hineinzoomen" aria-label="Hineinzoomen">+</button>
          <button id="reset" title="Zurück zur Gesamtansicht">1500–1715</button>
          <button id="rotate" type="button" title="Darstellung um 90° drehen" aria-pressed="false">⟳ Senkrecht</button>
        </div>
        <div class="group">
          <label class="detail">Detailgrad
            <input id="detail" type="range" min="-2" max="2" step="1" />
          </label>
        </div>
        <div class="group export">
          <select id="pdf-format" aria-label="PDF-Format" title="Hoch- oder Querformat wird automatisch gewählt">
            <option value="a4">A4</option>
            <option value="a3">A3</option>
            <option value="fit">passend</option>
          </select>
          <button id="export-pdf">PDF</button>
          <button id="export-jpeg">JPEG</button>
          <button id="copy-link" title="Link zu dieser Ansicht kopieren">Link</button>
        </div>
      </div>
      <div id="categories" class="categories" role="group" aria-label="Kategorien"></div>
    </header>

    <main class="layout">
      <div id="chart" class="chart">
        <svg id="timeline" role="img" aria-label="Zeitleiste"></svg>
      </div>
      <aside id="detail-panel" class="detail-panel" hidden></aside>
    </main>

    <footer class="statusbar">
      <span id="status"></span>
      <span class="hint">Mausrad / Ziehen: zoomen und verschieben · Klick auf einen Eintrag: Details</span>
    </footer>

    <div id="tooltip" class="tooltip" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
